name: 'Linux Preqrequisites'
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/dep-versions
    - name: Install Linux Prerequisites
      shell: bash
      run: |
        set -xe
        # See https://askubuntu.com/questions/272248/processing-triggers-for-man-db/1476024#1476024
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db

        cd ..

        sudo apt-get update
        # The top-level CMakeLists.txt turns ccache and lld on automatically when installed.
        # libvulkan1 and mesa-vulkan-drivers back headless Vulkan unit tests (e.g. RenderingTest).
        sudo apt-get install -y \
            clang-$GITHUB_CLANG_VERSION \
            lld-$GITHUB_CLANG_VERSION \
            libc++-$GITHUB_CLANG_VERSION-dev \
            libc++abi-$GITHUB_CLANG_VERSION-dev \
            mesa-common-dev libxi-dev libxxf86vm-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libx11-xcb-dev libgbm-dev libdrm-dev \
            libvulkan1 mesa-vulkan-drivers \
            ninja-build ccache

        # Download and extract the correct CMake binary based on runner architecture
        # We pin the CMake version to avoid sudden breakage due to runner updates.
        ARCH=$(uname -m)
        if [ "$ARCH" = "aarch64" ]; then
            CMAKE_ARCH="aarch64"
        else
            CMAKE_ARCH="x86_64"
        fi

        wget -qO- "https://github.com/Kitware/CMake/releases/download/v${GITHUB_CMAKE_VERSION}/cmake-${GITHUB_CMAKE_VERSION}-linux-${CMAKE_ARCH}.tar.gz" | sudo tar xz -C /usr/local --strip-components=1

        sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-${GITHUB_CLANG_VERSION} 100
        sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-${GITHUB_CLANG_VERSION} 100
        set +xe
