name: 'Auto-close restricted path edits'

# This workflow automatically closes pull requests that attempt to modify files
# within restricted directories:
# - .github/ and libs/gltfio/: Restricted to project maintainers (or PRs carrying
#   the "internal" label).
# - docs/: Restricted for all contributors (including maintainers), unless the PR
#   carries the "forcedocs" label as an escape hatch.
#
# We use 'pull_request_target' because it runs in the context of the base
# repository, granting it the necessary permissions to close PRs from forks.

on:
  # zizmor: ignore[dangerous-triggers] - pull_request_target is safe here: no code checkout or execution, only API calls to validate PR paths
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-close-restricted-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-close PR if it touches restricted paths
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          MSG_GITHUB: >
            Thank you for your contribution. To maintain the security and stability of our CI/CD pipelines,
            modifications to the `.github` directory are restricted to project maintainers.

            As a result, this Pull Request has been automatically closed. If you have suggestions for
            improvements or bug fixes related to our GitHub configuration, please open an issue to discuss
            them with the team first. We appreciate your understanding.
          MSG_GLTFIO: >
            Thank you for your contribution. To ensure consistency and stability of the glTF loader library,
            modifications to the `libs/gltfio` directory are restricted to project maintainers.

            As a result, this Pull Request has been automatically closed. If you have suggestions for
            improvements or bug fixes, please open an issue to discuss them with the team first. We appreciate
            your understanding.
          MSG_DOCS: >
            Thank you for your contribution. The `docs` directory contains generated documentation and
            direct modifications to it are restricted. Documentation changes should be made to the
            corresponding source files in `docs_src` or the relevant `README.md` files instead (please see
            `docs_src/README.md` for details).

            As a result, this Pull Request has been automatically closed. If you have suggestions for
            documentation improvements or fixes, please update the source files or open an issue to discuss
            them with the team first. We appreciate your understanding.
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const labels = (context.payload.pull_request.labels || []).map(l => l.name);

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.payload.pull_request.user.login,
            });
            const isMaintainer = ['admin', 'maintain', 'write'].includes(permission.permission);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
            });

            const restrictions = [
              {
                path: '.github/',
                message: process.env.MSG_GITHUB.trim(),
                allowMaintainers: true,
                exemptLabel: 'internal',
              },
              {
                path: 'libs/gltfio/',
                message: process.env.MSG_GLTFIO.trim(),
                allowMaintainers: true,
                exemptLabel: 'internal',
              },
              {
                path: 'docs/',
                message: process.env.MSG_DOCS.trim(),
                allowMaintainers: false,
                exemptLabel: 'forcedocs',
              }
            ];

            let matchedRestriction = null;
            for (const restriction of restrictions) {
              if (restriction.allowMaintainers && isMaintainer) {
                continue;
              }
              if (labels.includes(restriction.exemptLabel)) {
                console.log(`Pull Request #${pull_number} has the "${restriction.exemptLabel}" label. Skipping check for ${restriction.path}.`);
                continue;
              }
              if (files.some(f => f.filename.startsWith(restriction.path))) {
                matchedRestriction = restriction;
                break;
              }
            }

            if (matchedRestriction) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: matchedRestriction.message,
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number,
                state: 'closed',
              });

              console.log(`Closed PR #${pull_number} because it touched the restricted path: ${matchedRestriction.path}`);
            }
