name: 'Presubmit CI'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# This will cancel in-flight runs when there is an update to a PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The conditional 'if' on each job skips presubmit jobs when:
# 1. A commit is pushed to main and is cryptographically "verified" (e.g., a GitHub UI
#    squash-and-merge that already passed presubmit during the Pull Request phase), or
# 2. The PR / commit only modifies files that do not affect that specific job, as classified by
#    the 'check-verification' gate job.
#
# Skipping individual jobs via job-level 'if' conditions (rather than workflow-level 'paths'
# filters) ensures GitHub reports each skipped job as 'skipped', which satisfies branch protection
# required status checks instead of leaving them pending.

permissions:
  contents: read

jobs:
  check-verification:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      build-mac: ${{ steps.check.outputs.build-mac }}
      build-linux: ${{ steps.check.outputs.build-linux }}
      build-windows: ${{ steps.check.outputs.build-windows }}
      build-android: ${{ steps.check.outputs.build-android }}
      build-ios: ${{ steps.check.outputs.build-ios }}
      build-web: ${{ steps.check.outputs.build-web }}
      renderdiff-config: ${{ steps.check.outputs.renderdiff-config }}
      renderdiff-run: ${{ steps.check.outputs.renderdiff-run }}
      renderdiff-platforms: ${{ steps.check.outputs.renderdiff-platforms }}
      code-correctness: ${{ steps.check.outputs.code-correctness }}
      check-headers: ${{ steps.check.outputs.check-headers }}
      test-backend: ${{ steps.check.outputs.test-backend }}
      test-backend-metal: ${{ steps.check.outputs.test-backend-metal }}
    steps:
      - name: Check commit verification and classify changed paths
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            let changedFiles = null;

            if (context.eventName === 'push') {
              const { data } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: context.sha,
              });
              if (data.commit.verification.verified) {
                core.setOutput('skip', 'true');
                core.setOutput('renderdiff-platforms', JSON.stringify(['desktop', 'web']));
                return;
              }
              // GitHub's getCommit API caps the files list at 300 entries. If the commit
              // touches fewer than 300 files and is not a file-less merge, we can classify
              // its exact path list; otherwise fall back to running all jobs.
              if (Array.isArray(data.files) && data.files.length > 0 && data.files.length < 300) {
                changedFiles = data.files.map(f => f.filename);
              }
            } else if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              changedFiles = files.map(f => f.filename);
            }

            // Inert files that never affect any presubmit build or test job.
            // Stripping these first ensures that required edits like NEW_RELEASE_NOTES.md
            // or documentation updates do not force unrelated platform builds to run.
            const INERT_EXACT = new Set([
              '.clang-format',
              '.cursorrules',
              '.dir-locals.el',
              '.editorconfig',
              '.gitignore',
              'AGENTS.md',
              'BUILDING.md',
              'CODE_STYLE.md',
              'CONTRIBUTING.md',
              'GEMINI.md',
              'LICENSE',
              'NEW_RELEASE_NOTES.md',
              'README.md',
              'RELEASE_NOTES.md',
              'SECURITY.md',
              '.github/workflows/auto-close-restricted-paths.yml',
              '.github/workflows/cocopods-deploy.yml',
              '.github/workflows/codeql.yml',
              '.github/workflows/npm-deploy.yml',
              '.github/workflows/postsubmit-main.yml',
              '.github/workflows/postsubmit.yml',
              '.github/workflows/release.yml',
              '.github/workflows/renderdiff-goldens.yml',
              '.github/workflows/status-android.yml',
              '.github/workflows/status-ios.yml',
              '.github/workflows/status-linux.yml',
              '.github/workflows/status-macos.yml',
              '.github/workflows/status-web.yml',
              '.github/workflows/status-windows.yml',
              '.github/workflows/verify-release-notes.yml',
            ]);

            const INERT_PREFIXES = [
              'art/',
              'docs/',
              'docs_src/',
              'ide/',
              'skills/',
              '.github/actions/android-continuous/',
              '.github/actions/ubuntu-apt-add-src/',
              '.github/actions/verify-release-notes/',
            ];

            function isInertFile(file) {
              if (INERT_EXACT.has(file)) return true;
              if (file.endsWith('.md')) return true;
              return INERT_PREFIXES.some(prefix => file.startsWith(prefix));
            }

            const jobs = {
              'build-mac': false,
              'build-linux': false,
              'build-windows': false,
              'build-android': false,
              'build-ios': false,
              'build-web': false,
              'renderdiff-config': false,
              'renderdiff-desktop': false,
              'renderdiff-web': false,
              'code-correctness': false,
              'check-headers': false,
              'test-backend': false,
              'test-backend-metal': false,
            };

            function enableAll() {
              for (const key of Object.keys(jobs)) {
                jobs[key] = true;
              }
            }

            function classifyFile(file) {
              if (/\.(c|cpp|h|hpp)$/.test(file)) {
                jobs['check-headers'] = true;
              }

              // Android-isolated files (plus renderdiff schema validation for default_test.json)
              if (file === 'android/samples/sample-render-validation/src/main/assets/default_test.json') {
                jobs['build-android'] = true;
                jobs['renderdiff-config'] = true;
                return;
              }
              if (
                file.startsWith('android/') ||
                file.startsWith('build/android/') ||
                /^build\/toolchain-.*-linux-android\.cmake$/.test(file) ||
                file.startsWith('test/sizeguard/')
              ) {
                jobs['build-android'] = true;
                return;
              }

              // iOS-isolated files
              if (
                file.startsWith('ios/') ||
                file.startsWith('build/ios/') ||
                file === 'third_party/clang/iOS.cmake' ||
                /^third_party\/clang\/usage_ios_.*\.cmake$/.test(file)
              ) {
                jobs['build-ios'] = true;
                return;
              }

              // Web/WASM-isolated files
              if (
                file.startsWith('web/') ||
                file.startsWith('build/web/') ||
                file === 'build/common/get-emscripten.sh' ||
                file.startsWith('.github/actions/web-prereq/')
              ) {
                jobs['build-web'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-web'] = true;
                return;
              }

              // Windows-isolated build scripts
              if (file.startsWith('build/windows/')) {
                jobs['build-windows'] = true;
                return;
              }

              // macOS-isolated build scripts and Apple CI prerequisites
              if (file.startsWith('build/mac/')) {
                jobs['build-mac'] = true;
                return;
              }
              if (
                file.startsWith('.github/actions/mac-prereq/') ||
                file === 'build/common/get-ninja.sh'
              ) {
                jobs['build-mac'] = true;
                jobs['build-ios'] = true;
                jobs['test-backend-metal'] = true;
                return;
              }

              // Linux-isolated build scripts (note: combine-static-libs.sh is shared across Unix)
              if (file === 'build/linux/build.sh' || file === 'build/linux/ci-common.sh') {
                jobs['build-linux'] = true;
                return;
              }

              // Metal backend & Apple-only Metal tests
              if (
                file.startsWith('filament/backend/src/metal/') ||
                file === 'filament/backend/include/backend/platforms/PlatformMetal.h' ||
                file === 'filament/backend/include/backend/platforms/PlatformMetal-ObjC.h' ||
                file === 'filament/backend/test/test_MetalAsyncJobs.mm' ||
                file === 'filament/backend/test/test_MetalBlitter.mm' ||
                file === 'filament/backend/test/MetalTest.mm' ||
                file.startsWith('test/check-metal-shaders/')
              ) {
                jobs['build-mac'] = true;
                jobs['build-ios'] = true;
                jobs['test-backend-metal'] = true;
                return;
              }

              // OS-specific WebGPU platform bridges
              if (
                file === 'filament/backend/include/backend/platforms/WebGPUPlatformAndroid.h' ||
                file === 'filament/backend/src/webgpu/platform/WebGPUPlatformAndroid.cpp' ||
                file === 'libs/filamentapp/src/backend_platforms/WebGPUPlatformHelperAndroid.cpp'
              ) {
                jobs['build-android'] = true;
                return;
              }
              if (
                file === 'filament/backend/include/backend/platforms/WebGPUPlatformWindows.h' ||
                file === 'filament/backend/src/webgpu/platform/WebGPUPlatformWindows.cpp' ||
                file === 'libs/filamentapp/src/backend_platforms/WebGPUPlatformHelperWindows.cpp'
              ) {
                jobs['build-windows'] = true;
                return;
              }
              if (
                file === 'filament/backend/include/backend/platforms/WebGPUPlatformApple.h' ||
                file === 'filament/backend/src/webgpu/platform/WebGPUPlatformApple.mm' ||
                file === 'libs/filamentapp/src/backend_platforms/WebGPUPlatformHelperApple.mm'
              ) {
                jobs['build-mac'] = true;
                jobs['build-ios'] = true;
                return;
              }
              if (
                file === 'filament/backend/include/backend/platforms/WebGPUPlatformWasm.h' ||
                file === 'filament/backend/include/backend/platforms/WebGPUWasmPolyfill.h' ||
                file === 'filament/backend/src/webgpu/platform/WebGPUPlatformWasm.cpp' ||
                file === 'libs/filamentapp/src/backend_platforms/WebGPUPlatformHelperWasm.cpp'
              ) {
                jobs['build-web'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-web'] = true;
                return;
              }
              if (
                file === 'filament/backend/include/backend/platforms/WebGPUPlatformLinux.h' ||
                file === 'filament/backend/src/webgpu/platform/WebGPUPlatformLinux.cpp' ||
                file === 'libs/filamentapp/src/backend_platforms/WebGPUPlatformHelperLinux.cpp'
              ) {
                jobs['build-linux'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-desktop'] = true;
                jobs['code-correctness'] = true;
                jobs['test-backend'] = true;
                return;
              }

              // Shared WebGPU backend & Dawn (only compiled where -W is passed in presubmit)
              if (
                file.startsWith('filament/backend/src/webgpu/') ||
                file === 'filament/backend/include/backend/platforms/WebGPUPlatform.h' ||
                file.startsWith('filament/backend/test/test_WebGPU') ||
                file.startsWith('third_party/dawn/')
              ) {
                jobs['build-linux'] = true;
                jobs['build-web'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-desktop'] = true;
                jobs['renderdiff-web'] = true;
                jobs['code-correctness'] = true;
                jobs['test-backend'] = true;
                return;
              }

              // Android-only C++ sources in filament/backend and libs
              if (
                file.startsWith('filament/backend/src/Android') ||
                file === 'filament/backend/src/BackendUtilsAndroid.cpp' ||
                file === 'filament/backend/include/private/backend/BackendUtilsAndroid.h' ||
                file === 'filament/backend/src/VirtualMachineEnv.cpp' ||
                file === 'filament/backend/include/private/backend/VirtualMachineEnv.h' ||
                file === 'filament/backend/include/backend/platforms/AndroidNdk.h' ||
                file === 'filament/backend/include/backend/platforms/PlatformEGLAndroid.h' ||
                file === 'filament/backend/include/backend/platforms/VulkanPlatformAndroid.h' ||
                file.startsWith('filament/backend/src/opengl/platforms/ExternalStreamManagerAndroid.') ||
                file === 'filament/backend/src/opengl/platforms/PlatformEGLAndroid.cpp' ||
                file === 'filament/backend/src/vulkan/platform/VulkanPlatformAndroid.cpp' ||
                file.startsWith('libs/utils/src/android/') ||
                file === 'libs/filamentapp/src/backend_platforms/VulkanPlatformHelperAndroid.cpp'
              ) {
                jobs['build-android'] = true;
                return;
              }

              // Windows-only C++/ASM sources in filament/backend and libs
              if (
                file === 'filament/backend/include/backend/platforms/PlatformWGL.h' ||
                file === 'filament/backend/src/opengl/platforms/PlatformWGL.cpp' ||
                file === 'filament/backend/include/backend/platforms/VulkanPlatformWindows.h' ||
                file === 'filament/backend/src/vulkan/platform/VulkanPlatformWindows.cpp' ||
                file.startsWith('libs/utils/src/win32/') ||
                file === 'libs/filamentapp/src/display_managers/NativeWindowHelperWindows.cpp' ||
                file === 'libs/filamentapp/src/backend_platforms/VulkanPlatformHelperWindows.cpp' ||
                file === 'libs/bluegl/src/BlueGLWindows.cpp' ||
                file === 'libs/bluegl/src/BlueGLCoreWindowsImpl.S' ||
                file === 'libs/bluegl/src/BlueGLCoreWindows32Impl.cpp' ||
                file === 'libs/bluevk/src/BlueVKWindows.cpp'
              ) {
                jobs['build-windows'] = true;
                return;
              }

              // iOS-only ObjC++ sources in filament/backend
              if (
                file === 'filament/backend/include/backend/platforms/PlatformCocoaTouchGL.h' ||
                file === 'filament/backend/src/opengl/platforms/PlatformCocoaTouchGL.mm' ||
                file.startsWith('filament/backend/src/opengl/platforms/CocoaTouchExternalImage.')
              ) {
                jobs['build-ios'] = true;
                return;
              }

              // Apple-only (macOS + iOS) C++/ObjC++/ASM sources in filament/backend and libs
              if (
                file === 'filament/backend/include/backend/platforms/PlatformCocoaGL.h' ||
                file === 'filament/backend/src/opengl/platforms/PlatformCocoaGL.mm' ||
                file.startsWith('filament/backend/src/opengl/platforms/CocoaExternalImage.') ||
                file === 'filament/backend/include/backend/platforms/VulkanPlatformApple.h' ||
                file === 'filament/backend/src/vulkan/platform/VulkanPlatformApple.mm' ||
                file.startsWith('libs/utils/src/darwin/') ||
                file === 'libs/filamentapp/src/display_managers/NativeWindowHelperCocoa.mm' ||
                file === 'libs/filamentapp/src/backend_platforms/VulkanPlatformHelperApple.mm' ||
                file === 'libs/bluegl/src/BlueGLDarwin.cpp' ||
                file === 'libs/bluegl/src/BlueGLCoreDarwinUniversalImpl.S' ||
                file === 'libs/bluevk/src/BlueVKDarwin.cpp'
              ) {
                jobs['build-mac'] = true;
                jobs['build-ios'] = true;
                jobs['test-backend-metal'] = true;
                return;
              }

              // Web/WASM-only C++/JS/HTML sources in filament/backend and libs
              if (
                file === 'filament/backend/include/backend/platforms/PlatformWebGL.h' ||
                file === 'filament/backend/src/opengl/platforms/PlatformWebGL.cpp' ||
                file.startsWith('libs/utils/src/web/') ||
                file === 'libs/filamentapp/src/display_managers/EmscriptenDisplayManager.cpp' ||
                file === 'libs/filamentapp/src/display_managers/HtmlDisplayManager.cpp' ||
                file.startsWith('libs/filamentapp/src/display_managers/web/')
              ) {
                jobs['build-web'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-web'] = true;
                return;
              }

              // Renderdiff suite & glTF asset helpers
              if (
                file === 'test/renderdiff/src/test_schema.py' ||
                file === 'test/renderdiff/tests/sample.json'
              ) {
                jobs['renderdiff-config'] = true;
                return;
              }
              if (
                file.startsWith('test/renderdiff/') ||
                file.startsWith('test/render-validation/') ||
                file.startsWith('.github/actions/renderdiff/') ||
                file.startsWith('.github/actions/get-gltf-assets/') ||
                file === 'build/common/get-gltf-sample-assets.sh'
              ) {
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-desktop'] = true;
                jobs['renderdiff-web'] = true;
                return;
              }
              if (file.startsWith('tools/diffimg/')) {
                jobs['build-mac'] = true;
                jobs['build-linux'] = true;
                jobs['build-windows'] = true;
                jobs['code-correctness'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-desktop'] = true;
                jobs['renderdiff-web'] = true;
                return;
              }

              // Mesa & Vulkan SDK CI actions (used only by Linux backend tests and desktop renderdiff)
              if (
                file.startsWith('.github/actions/get-mesa/') ||
                file === 'build/common/get-mesa.sh' ||
                file.startsWith('.github/actions/get-vulkan-sdk/') ||
                file === 'build/common/get-vulkan-sdk.sh'
              ) {
                jobs['test-backend'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-desktop'] = true;
                return;
              }

              // Backend test harness & sources
              if (file.startsWith('test/backend/')) {
                jobs['test-backend'] = true;
                jobs['test-backend-metal'] = true;
                return;
              }
              if (
                file === 'filament/backend/test/mac_runner.mm' ||
                file === 'filament/backend/test/test_RenderExternalImage.cpp'
              ) {
                jobs['build-mac'] = true;
                jobs['test-backend-metal'] = true;
                return;
              }
              if (file === 'filament/backend/test/linux_runner.cpp') {
                jobs['build-linux'] = true;
                jobs['code-correctness'] = true;
                jobs['test-backend'] = true;
                return;
              }
              if (file.startsWith('filament/backend/test/')) {
                jobs['build-mac'] = true;
                jobs['build-linux'] = true;
                jobs['code-correctness'] = true;
                jobs['test-backend'] = true;
                jobs['test-backend-metal'] = true;
                if (file === 'filament/backend/test/test_ThreadPriorityOverride.cpp') {
                  jobs['build-android'] = true;
                }
                return;
              }

              // Code correctness, header organization, and unit test suites
              if (
                file === 'test/code-correctness/check-headers.sh' ||
                file.startsWith('tools/reorganize-headers/')
              ) {
                jobs['check-headers'] = true;
                return;
              }
              if (
                file.startsWith('test/code-correctness/') ||
                file.startsWith('test/filament-unit-test/')
              ) {
                jobs['code-correctness'] = true;
                return;
              }
              if (
                file.startsWith('filament/test/') ||
                /^libs\/[^/]+\/tests?\//.test(file) ||
                /^tools\/[^/]+\/tests?\//.test(file)
              ) {
                jobs['build-mac'] = true;
                jobs['build-linux'] = true;
                jobs['build-windows'] = true;
                jobs['code-correctness'] = true;
                return;
              }

              // Desktop/Android samples and sample assets (excluded from default iOS, WASM, and backend test builds)
              if (file.startsWith('samples/') || file.startsWith('assets/')) {
                jobs['build-mac'] = true;
                jobs['build-linux'] = true;
                jobs['build-windows'] = true;
                jobs['build-android'] = true;
                jobs['code-correctness'] = true;
                jobs['renderdiff-config'] = true;
                jobs['renderdiff-desktop'] = true;
                jobs['renderdiff-web'] = true;
                return;
              }

              // Host-only tools not built as prebuilts by Android, iOS, WASM, renderdiff, or backend tests
              if (
                file.startsWith('tools/ai/') ||
                file.startsWith('tools/apigen/') ||
                file.startsWith('tools/beamsplitter/') ||
                file.startsWith('tools/cso-lut/') ||
                file.startsWith('tools/frame_pipeline_visualizer/') ||
                file.startsWith('tools/matedit/') ||
                file.startsWith('tools/matinfo/') ||
                file.startsWith('tools/normal-blending/') ||
                file.startsWith('tools/rgb-to-lmsr/') ||
                file.startsWith('tools/roughness-prefilter/') ||
                file.startsWith('tools/specgen/') ||
                file.startsWith('tools/specular-color/') ||
                file.startsWith('tools/taa/') ||
                file.startsWith('tools/zbloat/')
              ) {
                jobs['build-mac'] = true;
                jobs['build-linux'] = true;
                if (!file.startsWith('tools/matedit/')) {
                  jobs['build-windows'] = true;
                }
                jobs['code-correctness'] = true;
                return;
              }

              enableAll();
            }

            if (changedFiles === null) {
              enableAll();
            } else {
              const activeFiles = changedFiles.filter(f => !isInertFile(f));
              for (const file of activeFiles) {
                classifyFile(file);
              }
            }

            const renderdiffPlatforms = [];
            if (jobs['renderdiff-desktop']) renderdiffPlatforms.push('desktop');
            if (jobs['renderdiff-web']) renderdiffPlatforms.push('web');
            const renderdiffRun = renderdiffPlatforms.length > 0;

            for (const [key, val] of Object.entries(jobs)) {
              if (key === 'renderdiff-desktop' || key === 'renderdiff-web') continue;
              core.setOutput(key, val ? 'true' : 'false');
            }
            core.setOutput('renderdiff-run', renderdiffRun ? 'true' : 'false');
            // Always emit a non-empty JSON array so GitHub Actions matrix evaluation
            // never fails on an empty vector when test-renderdiff-platform is skipped.
            core.setOutput(
              'renderdiff-platforms',
              JSON.stringify(renderdiffRun ? renderdiffPlatforms : ['desktop', 'web'])
            );

  build-desktop-mac:
    name: build-mac
    runs-on: 'macos-15-xlarge'
    timeout-minutes: 45
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.build-mac == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-prereq
      - uses: ./.github/actions/ccache
        with:
          config: desktop
      - name: Run build script
        run: |
          cd build/mac && printf "y" | ./build.sh presubmit
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  build-desktop-linux:
    name: build-linux
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 45
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.build-linux == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: ./.github/actions/ccache
        with:
          config: desktop-release
      - name: Run build script
        run: |
          cd build/linux && printf "y" | ./build.sh presubmit
      - name: Test - material parser
        run: |
          out/cmake-release/filament/test/test_material_parser
      # From the former build-wgsl-webgpu job. build/linux/build.sh passes -W, so the release tree
      # already has the WebGPU backend and the WGSL code path in filamat.
      - name: Test - WGSL material compiler
        run: out/cmake-release/libs/filamat/test_filamat --gtest_filter=MaterialCompiler.Wgsl*
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  build-windows:
    name: build-windows
    runs-on: 'windows-2022'
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.build-windows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ccache
        with:
          config: desktop
      - name: Run build script
        run: |
          build\windows\build-github.bat presubmit
        shell: cmd
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  build-android:
    name: build-android
    runs-on: 'ubuntu-24.04-8core'
    timeout-minutes: 45
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.build-android == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      # Restore only; the postsubmit ccache-android job is the writer. It covers the two host tool
      # passes and the aarch64 tree, but not the gradle externalNativeBuild modules, which
      # configure their own CMakeLists and never see the launcher the root one installs.
      - uses: ./.github/actions/ccache
        with:
          config: android-arm64-release
      - name: Run build script
        # Only build 1 64 bit target during presubmit to cut down build times during presubmit
        # Continuous builds will build everything
        run: |
          pushd .
          cd build/android && printf "y" | ./build.sh presubmit-with-archive arm64-v8a
          popd
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      - id: get_commit_msg
        uses: ./.github/actions/get-commit-msg
      - name: Check artifact sizes
        env:
          OUTPUTS_HASHES: ${{ steps.get_commit_msg.outputs.hashes }}
        run: |
          python3 test/sizeguard/dump_artifact_size.py out/*.aar > current_size.json
          BYPASS_ARG=""
          if python3 test/sizeguard/check_bypass.py ${OUTPUTS_HASHES}; then
              BYPASS_ARG="--bypass"
          fi
          python3 test/sizeguard/check_size.py current_size.json \
              --target-branch origin/main \
              --threshold 20480 \
              --artifacts filament-android-release.aar/jni/arm64-v8a/libfilament-jni.so \
              $BYPASS_ARG || { echo "To bypass this failure, please add SIZEGUARD_BYPASS to your *commit* message on a line by itself."; exit 1; }

  build-ios:
    name: build-iOS
    runs-on: 'macos-15-xlarge'
    timeout-minutes: 45
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.build-ios == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-prereq
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      # Restore only; the postsubmit build-ios job is the writer. It selects the same Xcode, which
      # matters because CCACHE_COMPILERCHECK hashes the compiler binary.
      - uses: ./.github/actions/ccache
        with:
          config: ios
      - name: Run build script
        run: |
          cd build/ios && printf "y" | ./build.sh presubmit
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      # Not covered by the cache: build-samples.sh drives xcodebuild against the hand-written
      # projects under ios/samples, which CMake never generates.
      - name: Build iOS samples
        run: |
          cd build/ios && ./build-samples.sh presubmit

  build-web:
    name: build-web
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 45
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.build-web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: ./.github/actions/web-prereq
      # Restore only; the postsubmit build-web job is the writer. Its "continuous" build adds a
      # debug WASM pass on top of what this job compiles and is otherwise flag-identical.
      #
      # After web-prereq, which is what puts GITHUB_EMSDK_VERSION in the environment, and which
      # must also have placed emsdk at its fixed workspace path before anything hashes the
      # compiler. The version belongs in the key because em++ is a launcher stub that execs
      # em++.py: CCACHE_COMPILERCHECK=content hashes the stub, which does not change when
      # emscripten does. Keying on the pinned version is what makes a bump of
      # build/common/versions start from an empty cache rather than serve objects the previous
      # toolchain produced.
      - uses: ./.github/actions/ccache
        with:
          config: web-emsdk-${{ env.GITHUB_EMSDK_VERSION }}
      - name: Run build script
        run: |
          cd build/web && printf "y" | ./build.sh presubmit
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  # Cheap gate for test-renderdiff below. It exists so that the expensive job can be skipped whole
  # rather than step by step: a RDIFF_ACCEPT_NEW_GOLDENS commit used to allocate the renderdiff
  # runner and check the repository out only to do nothing, which is worth avoiding now that the
  # runner is a paid one.
  #
  # The schema validation lives here for the same reason. It needs no build, only the glTF assets
  # and under a second of Python, so a typo in a test JSON should fail within a minute rather than
  # at the end of the longest job in the workflow.
  renderdiff-config:
    name: renderdiff-config
    runs-on: 'ubuntu-24.04'
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.renderdiff-config == 'true'
    outputs:
      accept: ${{ steps.check_accept.outputs.accept }}
      golden-branch: ${{ steps.check_accept.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: get_commit_msg
        uses: ./.github/actions/get-commit-msg
      - name: Read the renderdiff commit message tags
        id: check_accept
        env:
          COMMIT_MESSAGE: ${{ steps.get_commit_msg.outputs.msg }}
        run: |
          if echo "${COMMIT_MESSAGE}" | python3 test/renderdiff/src/commit_msg.py --mode=accept_new_goldens; then
            echo "accept=true" >> "$GITHUB_OUTPUT"
          else
            echo "accept=false" >> "$GITHUB_OUTPUT"
          fi
          # RDIFF_BRANCH, or "main" when the commit message does not name a branch. Whitespace is
          # stripped because the tag is parsed out of free-form prose and a git ref cannot contain
          # any: a line like "RDIFF_BRANCH=foo (see #123)" otherwise yields a trailing space, which
          # the consumers of this output quote and pass through.
          GOLDEN_BRANCH=$(echo "${COMMIT_MESSAGE}" | python3 test/renderdiff/src/commit_msg.py | tr -d '[:space:]')
          echo "branch=${GOLDEN_BRANCH}" >> "$GITHUB_OUTPUT"
        shell: bash
      # Needed by the validation below, not by this job's own logic: a gltf_test names its models
      # by bare name and the parser resolves each one against model_search_paths on disk, so a
      # tree without the downloaded assets reports every model in gltf/ as missing. This is a
      # cache restore of a key the renderdiff job shares, so it costs a download only when that
      # job would have had to download too.
      - uses: ./.github/actions/get-gltf-assets
      - name: Validate renderdiff test schemas
        run: |
          python3 test/renderdiff/src/test_schema.py \
              test/renderdiff/tests/presubmit.json \
              test/renderdiff/tests/sample.json \
              android/samples/sample-render-validation/src/main/assets/default_test.json
        shell: bash

  # Renders the suite and compares it against the goldens in filament-assets.
  #
  # ARM Linux rather than macOS. This used to run on macos-15-xlarge, where 15 of its 26 minutes
  # were an uncached debug build, because no macOS job warms a cache for these flags. Here it
  # restores desktop-renderdiff from the postsubmit warmer, on a runner tier that costs a fraction
  # of the macOS one. The goldens are generated on this same runner label; macOS renders are still
  # produced by the postsubmit test-renderdiff-mac job, but nothing compares them.
  #
  # One leg per platform. Desktop renders natively against mesa; web builds wasm and drives a
  # headless browser. Goldens are kept separately per platform, so the legs never compare against
  # each other.
  #
  # The job has no explicit name. GitHub then names the legs after the matrix value, and a job
  # skipped by its if is listed under the bare job id instead of an unexpanded matrix expression.
  # The required check is test-renderdiff below, which gates on these legs.
  test-renderdiff-platform:
    strategy:
      # A desktop regression should not hide a web regression, or vice versa.
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.check-verification.outputs.renderdiff-platforms) }}
    runs-on: 'arm-ubuntu-24.04-16core'
    # The web leg additionally builds wasm and renders through a software rasterizer in a browser,
    # which is substantially slower than rendering natively.
    timeout-minutes: ${{ matrix.platform == 'web' && 90 || 45 }}
    needs: [check-verification, renderdiff-config]
    # The first clause is the workflow-wide verified-commit convention documented at the top of
    # this file. The second is this job's own: a gate that failed to parse the commit message has
    # no branch name to offer, and rendering against the wrong goldens is worse than not rendering.
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.renderdiff-run == 'true'
      && needs.renderdiff-config.result == 'success'
      && needs.renderdiff-config.outputs.accept != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/renderdiff
        with:
          compare: 'true'
          golden-branch: ${{ needs.renderdiff-config.outputs.golden-branch }}
          # The web build restores the cache the postsubmit build-web job writes, which also runs
          # this leg's build through generate.sh --build-only; the renderdiff action appends the
          # emsdk version.
          ccache-config: ${{ matrix.platform == 'web' && 'web-emsdk' || 'desktop-renderdiff' }}
          platform: ${{ matrix.platform }}
      # Uploaded even when the comparison failed, which is exactly when the images are wanted.
      # Retained long enough to still be there when a golden regression is traced back, months
      # later, to the run that introduced it. These are also the images the golden bootstrap
      # procedure in test/renderdiff/README.md picks up.
      #
      # Artifact names must be unique across the matrix, so each leg uploads its own and
      # test-renderdiff below combines them.
      - name: Upload renderdiff output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: presubmit-renderdiff-result-${{ matrix.platform }}
          path: ./out/renderdiff
          retention-days: 100

  # The required check. It passes when RDIFF_ACCEPT_NEW_GOLDENS skipped rendering, and otherwise
  # only when every platform leg passed.
  #
  # It also merges the legs' outputs into the single presubmit-renderdiff-result artifact, because
  # tools outside this repository (filament-rdiff-server) expect a run to have exactly one
  # renderdiff artifact. The legs write disjoint files apart from the golden checkout and the test
  # config, which are identical in both.
  test-renderdiff:
    name: test-renderdiff
    runs-on: 'ubuntu-24.04'
    needs: [check-verification, renderdiff-config, test-renderdiff-platform]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.renderdiff-config == 'true'
    steps:
      - name: Merge renderdiff output
        if: needs.test-renderdiff-platform.result != 'skipped'
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presubmit-renderdiff-result
          pattern: presubmit-renderdiff-result-*
          delete-merged: true
          retention-days: 100
      - name: Check the platform legs
        if: ${{ !cancelled() }}
        env:
          CONFIG: ${{ needs.renderdiff-config.result }}
          ACCEPT: ${{ needs.renderdiff-config.outputs.accept }}
          RENDER_RUN: ${{ needs.check-verification.outputs.renderdiff-run }}
          LEGS: ${{ needs.test-renderdiff-platform.result }}
        run: |
          if [[ "${CONFIG}" == success && "${ACCEPT}" == true ]]; then
            echo "RDIFF_ACCEPT_NEW_GOLDENS is set; rendering was skipped."
            exit 0
          fi
          if [[ "${CONFIG}" == success && "${RENDER_RUN}" != true ]]; then
            echo "Only renderdiff schema validation was required; rendering was skipped."
            exit 0
          fi
          echo "renderdiff-config: ${CONFIG}, test-renderdiff-platform: ${LEGS}"
          [[ "${CONFIG}" == success && "${LEGS}" == success ]]
        shell: bash

  test-code-correctness:
    name: test-code-correctness
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 60
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.code-correctness == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      # This job compiles two configurations, so it restores both caches into the same ccache
      # directory. The two archives hold disjoint objects, because ccache keys on the full
      # compiler command line and an asan object never shares a hash with a release one; the only
      # files they have in common are the statistics counters, which the action zeroes anyway.
      - uses: ./.github/actions/ccache
        with:
          config: desktop-release
      - uses: ./.github/actions/ccache
        with:
          config: desktop-asan-debug
      - name: Get commit message
        id: get_commit_msg
        uses: ./.github/actions/get-commit-msg
      - name: Check - header organization
        env:
          COMMIT_MESSAGE: ${{ steps.get_commit_msg.outputs.msg }}
          GIHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=()
            while IFS= read -r -d '' file; do
              FILES+=("$file")
            done < <(git diff -z --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
            if [ ${#FILES[@]} -gt 0 ]; then
              bash test/code-correctness/check-headers.sh "${FILES[@]}"
            else
              echo "No files to check."
            fi
          else
            bash test/code-correctness/check-headers.sh ${GITHUB_SHA}
          fi
      - name: Run build script
        # We need to build before clang-tidy can run analysis
        run: |
          # -b enables ASAN and UBSAN (Address and Undefined Behavior Sanitizers) for the debug build.
          # -d and -t compile matdbg and fgviewer, which build.sh otherwise always disables, so this
          # is the only presubmit build that covers them. Their servers only start when
          # FILAMENT_MATDBG_PORT or FILAMENT_FGVIEWER_PORT is set, so the unit tests below, which
          # run against this tree, behave the same. The postsubmit desktop-asan-debug warmer must
          # run this exact command for the cache to hit.
          ./build.sh -b -d -t -p desktop debug
          # This will build and install the release build. -W and -y none reproduce what
          # build/linux/build.sh passes for a release-only build; they have to, because this build
          # and build-linux share the desktop-release cache.
          ./build.sh -W -y none -p desktop release && ninja -C out/cmake-release install
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      - name: Check - clang-tidy (exception escape)
        run: bash test/code-correctness/clang-tidy-proxy.sh
      - name: Check - public header inclusion
        run: bash test/code-correctness/headers-inclusion.sh out/release/filament/include
      - name: Check - Filament unit tests
        run: |
          # The tests that render, such as RenderingTest, use Mesa's software Vulkan driver.
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          bash test/filament-unit-test/test.sh

  test-backend:
    name: test-backend
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 45
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.test-backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: ./.github/actions/get-mesa
      - uses: ./.github/actions/get-vulkan-sdk
      # Deliberately after get-mesa: meson picks ccache up automatically when it is on PATH, so
      # configuring CCACHE_DIR any earlier would let a Mesa rebuild (which only happens when the
      # Mesa cache misses) spend this job's cache budget on Mesa objects that no other job wants.
      # The asan objects this job needs come from the postsubmit ccache-arm-linux warmer.
      - uses: ./.github/actions/ccache
        with:
          config: desktop-backend-test
      - name: Run backend tests
        shell: bash
        run: |
          bash test/backend/test.sh
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  # The Metal half of the backend suite. Separated because Metal only exists on macOS, and the two
  # share no build. No GPU-enabled one is needed. The hosted macOS runners expose an "Apple
  # Paravirtual device" through Apple's Virtualization framework.
  test-backend-metal:
    name: test-backend-metal
    runs-on: 'macos-15'
    timeout-minutes: 60
    needs: [check-verification]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.check-verification.outputs.test-backend-metal == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-prereq
      # Deliberately no xcode-select here. The writer of this cache, postsubmit build-mac, uses the
      # image's default Xcode, and CCACHE_COMPILERCHECK hashes the compiler binary, so selecting a
      # different one would miss on every object.
      - uses: ./.github/actions/ccache
        with:
          config: desktop
      - name: Run Metal backend tests
        shell: bash
        run: |
          bash test/backend/test.sh --backend=metal
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  # A single gate over the backend suites, so that branch protection can require one check rather
  # than one per backend. The results are inspected explicitly because a job that declares `needs`
  # is skipped when a dependency fails, and GitHub reports a skipped required check as a successful
  # one. A skipped dependency is accepted because that is how the verified-commit convention
  # documented above disables presubmit for a push to main.
  test-backend-all:
    name: test-backend-all
    runs-on: 'ubuntu-24.04'
    needs: [check-verification, test-backend, test-backend-metal]
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && (needs.check-verification.outputs.test-backend == 'true'
          || needs.check-verification.outputs.test-backend-metal == 'true')
    steps:
      - name: Check the backend job results
        shell: bash
        # Read through the environment rather than interpolating into the script body, so that the
        # values cannot be parsed as shell.
        env:
          TEST_BACKEND: ${{ needs.test-backend.result }}
          TEST_BACKEND_METAL: ${{ needs.test-backend-metal.result }}
        run: |
          echo "test-backend:       ${TEST_BACKEND}"
          echo "test-backend-metal: ${TEST_BACKEND_METAL}"
          FAILED=0
          for RESULT in "${TEST_BACKEND}" "${TEST_BACKEND_METAL}"; do
            case "${RESULT}" in
              success|skipped) ;;
              *) FAILED=1 ;;
            esac
          done
          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::A backend job did not pass. See the per-job results above, and the job" \
                 "itself for the failure."
            exit 1
          fi
