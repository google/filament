name: 'Presubmit CI'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# This will cancel in-flight runs when there is an update to a PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The conditional 'if' on each job is meant to skip presubmit jobs when a commit is pushed to main
# and that commit is cryptographically "verified". Typically, a verified commit (like a GitHub UI
# squash-and-merge) has already passed through presubmit during the Pull Request phase.
# The conditional explicitly checks:
# 1. always() && !cancelled(): Ensures the job runs even if 'check-verification' is skipped
#    (which happens normally on PRs), but aborts if the workflow was manually cancelled.
# 2. !needs.check-verification.outputs.skip: Evaluates to true when the 'skip' output is empty.
#    The 'skip' output is only set to 'true' if it's a push to main AND the commit is verified.
#    In all other cases (including PRs where the job is skipped), it defaults to empty.

permissions:
  contents: read

jobs:
  check-verification:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check commit verification
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            if (data.commit.verification.verified) {
              core.setOutput('skip', 'true');
            }

  build-desktop-mac:
    name: build-mac
    runs-on: 'macos-15-xlarge'
    timeout-minutes: 45
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-prereq
      - uses: ./.github/actions/ccache
        with:
          config: desktop
      - name: Run build script
        run: |
          cd build/mac && printf "y" | ./build.sh presubmit
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  build-desktop-linux:
    name: build-linux
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 45
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: ./.github/actions/ccache
        with:
          config: desktop-release
      - name: Run build script
        run: |
          cd build/linux && printf "y" | ./build.sh presubmit
      - name: Test - material parser
        run: |
          out/cmake-release/filament/test/test_material_parser
      # From the former build-wgsl-webgpu job. build/linux/build.sh passes -W, so the release tree
      # already has the WebGPU backend and the WGSL code path in filamat.
      - name: Test - WGSL material compiler
        run: out/cmake-release/libs/filamat/test_filamat --gtest_filter=MaterialCompiler.Wgsl*
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  build-windows:
    name: build-windows
    runs-on: 'windows-2022'
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run build script
        run: |
          build\windows\build-github.bat presubmit
        shell: cmd

  build-android:
    name: build-android
    runs-on: 'ubuntu-24.04-8core'
    timeout-minutes: 45
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      # Restore only; the postsubmit ccache-android job is the writer. It covers the two host tool
      # passes and the aarch64 tree, but not the gradle externalNativeBuild modules, which
      # configure their own CMakeLists and never see the launcher the root one installs.
      - uses: ./.github/actions/ccache
        with:
          config: android-arm64-release
      - name: Run build script
        # Only build 1 64 bit target during presubmit to cut down build times during presubmit
        # Continuous builds will build everything
        run: |
          pushd .
          cd build/android && printf "y" | ./build.sh presubmit-with-archive arm64-v8a
          popd
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      - id: get_commit_msg
        uses: ./.github/actions/get-commit-msg
      - name: Check artifact sizes
        env:
          OUTPUTS_HASHES: ${{ steps.get_commit_msg.outputs.hashes }}
        run: |
          python3 test/sizeguard/dump_artifact_size.py out/*.aar > current_size.json
          BYPASS_ARG=""
          if python3 test/sizeguard/check_bypass.py ${OUTPUTS_HASHES}; then
              BYPASS_ARG="--bypass"
          fi
          python3 test/sizeguard/check_size.py current_size.json \
              --target-branch origin/main \
              --threshold 20480 \
              --artifacts filament-android-release.aar/jni/arm64-v8a/libfilament-jni.so \
              $BYPASS_ARG || { echo "To bypass this failure, please add SIZEGUARD_BYPASS to your *commit* message on a line by itself."; exit 1; }

  build-ios:
    name: build-iOS
    runs-on: 'macos-15-xlarge'
    timeout-minutes: 45
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-prereq
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      # Restore only; the postsubmit build-ios job is the writer. It selects the same Xcode, which
      # matters because CCACHE_COMPILERCHECK hashes the compiler binary.
      - uses: ./.github/actions/ccache
        with:
          config: ios
      - name: Run build script
        run: |
          cd build/ios && printf "y" | ./build.sh presubmit
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      # Not covered by the cache: build-samples.sh drives xcodebuild against the hand-written
      # projects under ios/samples, which CMake never generates.
      - name: Build iOS samples
        run: |
          cd build/ios && ./build-samples.sh presubmit

  build-web:
    name: build-web
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 45
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: ./.github/actions/web-prereq
      # Restore only; the postsubmit build-web job is the writer. Its "continuous" build adds a
      # debug WASM pass on top of what this job compiles and is otherwise flag-identical.
      #
      # After web-prereq, which is what puts GITHUB_EMSDK_VERSION in the environment, and which
      # must also have placed emsdk at its fixed workspace path before anything hashes the
      # compiler. The version belongs in the key because em++ is a launcher stub that execs
      # em++.py: CCACHE_COMPILERCHECK=content hashes the stub, which does not change when
      # emscripten does. Keying on the pinned version is what makes a bump of
      # build/common/versions start from an empty cache rather than serve objects the previous
      # toolchain produced.
      - uses: ./.github/actions/ccache
        with:
          config: web-emsdk-${{ env.GITHUB_EMSDK_VERSION }}
      - name: Run build script
        run: |
          cd build/web && printf "y" | ./build.sh presubmit
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}

  validate-docs:
    name: validate-docs
    runs-on: 'ubuntu-24.04'
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: get_commit_msg
        uses: ./.github/actions/get-commit-msg
      - name: Check for manual edits to /docs
        env:
          OUTPUTS_HASHES: ${{ steps.get_commit_msg.outputs.hashes }}
        run: |
          bash docs_src/build/presubmit_check.sh $OUTPUTS_HASHES

  # Cheap gate for test-renderdiff below. It exists so that the expensive job can be skipped whole
  # rather than step by step: a RDIFF_ACCEPT_NEW_GOLDENS commit used to allocate the renderdiff
  # runner and check the repository out only to do nothing, which is worth avoiding now that the
  # runner is a paid one.
  #
  # The schema validation lives here for the same reason. It needs no build, only the glTF assets
  # and under a second of Python, so a typo in a test JSON should fail within a minute rather than
  # at the end of the longest job in the workflow.
  renderdiff-config:
    name: renderdiff-config
    runs-on: 'ubuntu-24.04'
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    outputs:
      accept: ${{ steps.check_accept.outputs.accept }}
      golden-branch: ${{ steps.check_accept.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: get_commit_msg
        uses: ./.github/actions/get-commit-msg
      - name: Read the renderdiff commit message tags
        id: check_accept
        env:
          COMMIT_MESSAGE: ${{ steps.get_commit_msg.outputs.msg }}
        run: |
          if echo "${COMMIT_MESSAGE}" | python3 test/renderdiff/src/commit_msg.py --mode=accept_new_goldens; then
            echo "accept=true" >> "$GITHUB_OUTPUT"
          else
            echo "accept=false" >> "$GITHUB_OUTPUT"
          fi
          # RDIFF_BRANCH, or "main" when the commit message does not name a branch. Whitespace is
          # stripped because the tag is parsed out of free-form prose and a git ref cannot contain
          # any: a line like "RDIFF_BRANCH=foo (see #123)" otherwise yields a trailing space, which
          # the consumers of this output quote and pass through.
          GOLDEN_BRANCH=$(echo "${COMMIT_MESSAGE}" | python3 test/renderdiff/src/commit_msg.py | tr -d '[:space:]')
          echo "branch=${GOLDEN_BRANCH}" >> "$GITHUB_OUTPUT"
        shell: bash
      # Needed by the validation below, not by this job's own logic: a gltf_test names its models
      # by bare name and the parser resolves each one against model_search_paths on disk, so a
      # tree without the downloaded assets reports every model in gltf/ as missing. This is a
      # cache restore of a key the renderdiff job shares, so it costs a download only when that
      # job would have had to download too.
      - uses: ./.github/actions/get-gltf-assets
      - name: Validate renderdiff test schemas
        run: |
          python3 test/renderdiff/src/test_schema.py \
              test/renderdiff/tests/presubmit.json \
              test/renderdiff/tests/sample.json \
              android/samples/sample-render-validation/src/main/assets/default_test.json
        shell: bash

  # Renders the suite and compares it against the goldens in filament-assets.
  #
  # ARM Linux rather than macOS. This used to run on macos-15-xlarge, where 15 of its 26 minutes
  # were an uncached debug build, because no macOS job warms a cache for these flags. Here it
  # restores desktop-renderdiff from the postsubmit warmer, on a runner tier that costs a fraction
  # of the macOS one. The goldens are generated on this same runner label; macOS renders are still
  # produced by the postsubmit test-renderdiff-mac job, but nothing compares them.
  test-renderdiff:
    name: test-renderdiff
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 45
    needs: [check-verification, renderdiff-config]
    # The first clause is the workflow-wide verified-commit convention documented at the top of
    # this file. The second is this job's own: a gate that failed to parse the commit message has
    # no branch name to offer, and rendering against the wrong goldens is worse than not rendering.
    if: >
      always() && !cancelled() && !needs.check-verification.outputs.skip
      && needs.renderdiff-config.result == 'success'
      && needs.renderdiff-config.outputs.accept != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/renderdiff
        with:
          compare: 'true'
          golden-branch: ${{ needs.renderdiff-config.outputs.golden-branch }}
          ccache-config: desktop-renderdiff
      # Uploaded even when the comparison failed, which is exactly when the images are wanted.
      # Retained long enough to still be there when a golden regression is traced back, months
      # later, to the run that introduced it. These are also the images the golden bootstrap
      # procedure in test/renderdiff/README.md picks up.
      - name: Upload renderdiff output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: presubmit-renderdiff-result
          path: ./out/renderdiff
          retention-days: 100

  test-code-correctness:
    name: test-code-correctness
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 60
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      # This job compiles two configurations, so it restores both caches into the same ccache
      # directory. The two archives hold disjoint objects, because ccache keys on the full
      # compiler command line and an asan object never shares a hash with a release one; the only
      # files they have in common are the statistics counters, which the action zeroes anyway.
      - uses: ./.github/actions/ccache
        with:
          config: desktop-release
      - uses: ./.github/actions/ccache
        with:
          config: desktop-asan-debug
      - name: Get commit message
        id: get_commit_msg
        uses: ./.github/actions/get-commit-msg
      - name: Check - header organization
        env:
          COMMIT_MESSAGE: ${{ steps.get_commit_msg.outputs.msg }}
          GIHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=()
            while IFS= read -r -d '' file; do
              FILES+=("$file")
            done < <(git diff -z --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
            if [ ${#FILES[@]} -gt 0 ]; then
              bash test/code-correctness/check-headers.sh "${FILES[@]}"
            else
              echo "No files to check."
            fi
          else
            bash test/code-correctness/check-headers.sh ${GITHUB_SHA}
          fi
      - name: Run build script
        # We need to build before clang-tidy can run analysis
        run: |
          # -b enables ASAN and UBSAN (Address and Undefined Behavior Sanitizers) for the debug build
          ./build.sh -b -p desktop debug
          # This will build and install the release build. -W and -y none reproduce what
          # build/linux/build.sh passes for a release-only build; they have to, because this build
          # and build-linux share the desktop-release cache.
          ./build.sh -W -y none -p desktop release && ninja -C out/cmake-release install
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      - name: Check - clang-tidy (exception escape)
        run: bash test/code-correctness/clang-tidy-proxy.sh
      - name: Check - public header inclusion
        run: bash test/code-correctness/headers-inclusion.sh out/release/filament/include
      - name: Check - Filament unit tests
        run: bash test/filament-unit-test/test.sh

  test-backend:
    name: test-backend
    runs-on: 'arm-ubuntu-24.04-16core'
    timeout-minutes: 45
    needs: [check-verification]
    if: always() && !cancelled() && !needs.check-verification.outputs.skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: ./.github/actions/get-mesa
      - uses: ./.github/actions/get-vulkan-sdk
      # Deliberately after get-mesa: meson picks ccache up automatically when it is on PATH, so
      # configuring CCACHE_DIR any earlier would let a Mesa rebuild (which only happens when the
      # Mesa cache misses) spend this job's cache budget on Mesa objects that no other job wants.
      # The asan objects this job needs come from the postsubmit ccache-arm-linux warmer.
      - uses: ./.github/actions/ccache
        with:
          config: desktop-backend-test
      - name: Run backend tests
        shell: bash
        run: |
          bash test/backend/test.sh
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
