name: 'Postsubmit CI'

on:
  push:
    branches:
      - main
      - release
      - rc/**

permissions:
  contents: read

jobs:
  build-android:
    name: build-android
    # This used to run on ubuntu-24.04-4core, a billed larger runner, for disk space. Measured on
    # 2026-09-21 in run 35646616385: this exact build on the free standard runner never dropped
    # below 46 GB free of 145 GB, and finished in 104 minutes against the larger runner's 142. The
    # larger tier has the same 4 vCPUs, so it was buying neither space nor speed.
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - name: Run Android Continuous
        uses: ./.github/actions/android-continuous
        with:
          build-abi: armeabi-v7a,arm64-v8a,x86_64

  build-ios:
    name: build-ios
    runs-on: 'macos-15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-prereq
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      # Writer for the iOS cache. This job runs on the free standard runner while the presubmit
      # build-iOS it feeds runs on the paid xlarge one, so the warming costs nothing and the
      # savings land where the minutes are billed. The "continuous" build below is a superset of
      # what presubmit compiles: same device release objects, plus debug and simulator ones.
      - uses: ./.github/actions/ccache
        id: ccache
        with:
          config: ios
      - name: Run build script
        run: |
          cd build/ios && printf "y" | ./build.sh continuous
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      # Main only, to keep branch-scoped entries that nothing could read out of the repository's
      # shared cache quota. The ccache action documents why.
      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-ios
          path: out/filament-release-ios.tgz
      # Not covered by the cache above: build-samples.sh drives xcodebuild against the hand-written
      # projects under ios/samples, which CMake never generates, so the ccache launcher that
      # CMakeLists.txt installs does not apply to them.
      - name: Build iOS samples
        run: |
          cd build/ios && ./build-samples.sh continuous

  build-linux:
    name: build-linux
    runs-on: 'arm-ubuntu-24.04-16core'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      # Restore only. The ccache-arm-linux matrix below is the writer for Linux: it compiles
      # exactly the configurations presubmit needs, whereas the "continuous" build here also
      # produces a plain debug tree that no presubmit job compiles, which would spend most of the
      # cache on objects nothing can reuse. Only the release half of this build can hit, which is
      # why it restores the release variant.
      - uses: ./.github/actions/ccache
        with:
          config: desktop-release
      - name: Run build script
        run: |
          cd build/linux && printf "y" | ./build.sh continuous
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-arm-linux
          path: out/filament-release-arm-linux.tgz

  build-mac:
    name: build-mac
    runs-on: 'macos-15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-prereq
      - uses: ./.github/actions/ccache
        id: ccache
        with:
          config: desktop
      - name: Run build script
        run: |
          cd build/mac && printf "y" | ./build.sh continuous
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      # See the note on the linux job above: main only, to keep unreadable branch-scoped entries
      # out of the repository's shared cache quota.
      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-mac
          path: out/filament-release-darwin.tgz

  # macOS coverage for renderdiff. Presubmit renders on ARM Linux and compares against goldens
  # generated there, and a golden path records only the platform and the backend, not the host, so
  # there is no second golden set for macOS to compare against. This job exists so that the macOS
  # renderdiff path does not rot unnoticed between the rare times someone runs it by hand.
  #
  # It therefore does not compare. What it still catches is everything that fails outright: a
  # sample that stops building, stops running headless, crashes, or produces no image. render.py
  # already exits non-zero for all of those, so a failure here is a real one and turns the run red.
  # What it cannot catch is a macOS-only visual regression, which is the price of a single golden
  # set.
  #
  # Free standard runner, and deliberately without a compiler cache. The minutes cost nothing here,
  # whereas a second multi-gigabyte cache entry would push on a repository quota that is already
  # over budget, most likely evicting the Mesa cache that this very job depends on.
  test-renderdiff-mac:
    name: test-renderdiff-mac
    runs-on: 'macos-15'
    timeout-minutes: 120
    # One at a time per branch. A burst of commits should leave the newest one running rather than
    # queue several hour-long jobs onto the free macOS pool that build-mac and build-ios share.
    concurrency:
      group: test-renderdiff-mac-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/renderdiff
        with:
          compare: 'false'
      - name: Upload renderdiff output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: postsubmit-renderdiff-mac
          path: ./out/renderdiff
          retention-days: 100

  # Sole writer of the ARM Linux compiler caches. Every ARM Linux presubmit job restores what this
  # job produces, so what it compiles is exactly the set of configurations those jobs compile:
  #
  #   desktop-release         build-linux (WebGPU on, from build/linux/build.sh), and the release
  #                           half of test-code-correctness
  #   desktop-asan-debug      the asan/ubsan debug half of test-code-correctness
  #   desktop-backend-test    test-backend: asan/ubsan debug with webgpu and osmesa
  #   desktop-renderdiff      test-renderdiff: debug with webgpu and osmesa, no sanitizers, plus
  #                           every sample binary. Also read by the golden generation jobs.
  #
  # Presubmit cannot write the cache itself: a push to main carrying a verified commit skips every
  # presubmit job, so the cache would almost never be refreshed. Restricted to main because caches
  # written from release and rc/** are scoped to those branches, where nothing could read them.
  #
  # The free 4-vCPU ARM runner is deliberate. Paying for a 16-core runner would buy almost entirely
  # idle capacity, because once the cache is warm each pass only compiles what changed since the
  # last one. The cost is a slow first pass, which is why the save below runs even when the job is
  # cancelled or times out: each attempt banks the objects it managed to compile.
  #
  # The variants run as a matrix rather than in sequence because warmer latency decides how fresh
  # the cache is for the next pull request. Commits land on main every 83 minutes at the median
  # and every 45 at the busy quartile, which a sequential pass over three variants cannot keep up
  # with on 4 vCPUs. Running them in parallel costs nothing extra on free runners.
  ccache-arm-linux:
    name: ccache-arm-linux (${{ matrix.config }})
    runs-on: 'ubuntu-24.04-arm'
    timeout-minutes: 180
    strategy:
      # One broken configuration must still leave the others free to warm.
      fail-fast: false
      matrix:
        include:
          - config: desktop-release
            mesa: false
            build: cd build/linux && printf "y" | ./build.sh presubmit
          - config: desktop-asan-debug
            mesa: false
            build: ./build.sh -b -p desktop debug
          # --build-only stops before running the tests: this job wants the objects, and the tests
          # already run in presubmit. Calling the same script the consumer calls is what keeps the
          # cached objects flag-identical to what it will ask for.
          - config: desktop-backend-test
            mesa: true
            build: bash test/backend/test.sh --build-only
          # Same reasoning, and the same flag, for the renderdiff build: --build-only compiles the
          # renderers, the samples and diffimg, then stops before rendering.
          - config: desktop-renderdiff
            mesa: true
            build: bash test/renderdiff/generate.sh --build-only
    # Per variant, so that a slow configuration does not hold back the others. Queue the next pass
    # rather than running several at once, which would only duplicate work and multiply cache
    # writes.
    concurrency:
      group: ccache-arm-linux-${{ matrix.config }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      # Only the backend test build needs these, and each variant has to mirror its consumer's
      # prerequisites exactly: a prerequisite that changes an include path or a define changes the
      # compiler command line, which is what ccache hashes.
      - uses: ./.github/actions/get-mesa
        if: ${{ matrix.mesa }}
      - uses: ./.github/actions/get-vulkan-sdk
        if: ${{ matrix.mesa }}
      # After get-mesa, for the reason documented on the presubmit test-backend job.
      - uses: ./.github/actions/ccache
        id: ccache
        with:
          config: ${{ matrix.config }}
      - name: Warm the cache
        run: ${{ matrix.build }}
      # always(), where readers settle for !cancelled(): a warmer that times out is cancelled, and
      # that is the run whose cache size and disk headroom matter most.
      - uses: ./.github/actions/ccache-stats
        if: ${{ always() }}
        with:
          show-disk-usage: 'true'
      - name: Save ccache
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

  # Writer for the Android cache, read by the presubmit build-android job. Separate from the matrix
  # above rather than another entry in it: the NDK ships only a linux-x86_64 toolchain
  # (build/toolchain-aarch64-linux-android.cmake), the key carries runner.arch, and this one needs
  # a JDK.
  #
  # The free standard runner is enough, measured on 2026-09-21 in run 35634761917: a cold pass took
  # 42 minutes and ended with 82 GB free of 145 GB. That pass filled only 137 MiB, and hit 20% on
  # an empty cache, because the build compiles the host tools twice with identical flags.
  #
  # The postsubmit build-android job is deliberately not the writer: it compiles debug and release
  # across three ABIs, and the arm64-v8a release objects presubmit wants would be the first thing
  # evicted.
  ccache-android:
    name: ccache-android
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 180
    concurrency:
      group: ccache-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: ./.github/actions/ccache
        id: ccache
        with:
          config: android-arm64-release
      # The consumer's command, verbatim.
      - name: Warm the cache
        run: |
          cd build/android && printf "y" | ./build.sh presubmit-with-archive arm64-v8a
      - uses: ./.github/actions/ccache-stats
        if: ${{ always() }}
        with:
          show-disk-usage: 'true'
      - name: Save ccache
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

  build-web:
    name: build-web
    runs-on: 'arm-ubuntu-24.04-16core'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-prereq
      - uses: ./.github/actions/web-prereq
      # Writer for the WASM cache, on the same paid runner label the presubmit reader uses, which
      # is what keeps the workspace paths (and so the --use-port and compiler paths baked into the
      # compile lines) identical between the two. A free ARM warmer was considered and rejected:
      # this build configures four CMake trees, and a 4-vCPU runner would neither fit them in 14 GB
      # nor finish a cold pass in reasonable time. See the presubmit reader for why the emsdk
      # version is part of the key.
      - uses: ./.github/actions/ccache
        id: ccache
        with:
          config: web-emsdk-${{ env.GITHUB_EMSDK_VERSION }}
      - name: Run build script
        run: |
          cd build/web && printf "y" | ./build.sh continuous
      - uses: ./.github/actions/ccache-stats
        if: ${{ !cancelled() }}
      # See the note on the linux job above: main only, to keep unreadable branch-scoped entries
      # out of the repository's shared cache quota.
      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-web
          path: out/filament-release-web.tgz

  build-windows:
    name: build-windows
    runs-on: 'windows-2022'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run build script
        run: |
          build\windows\build-github.bat continuous
        shell: cmd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-windows
          path: out/filament-windows.tgz
